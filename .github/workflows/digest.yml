name: Daily AI Security Digest

on:
  schedule:
    # Запуск каждый день в 05:00 по МСК (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 👇 ЭТА СЕКЦИЯ КРИТИЧЕСКИ ВАЖНА 👇
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}  # <-- Должно быть так
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}            # <-- Должно быть так

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run digest script
        run: python -u digest.py
